<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FraudFiles</title>
</head>

<body>
    <nav class="navbar">
        <h2><a class="home" href="index.html">THE FRAUD FILES</a></h2>
        <div class="navbarDIV"> 
            <a class = "navbarA" href="">Account</a>
            <a class = "navbarA" href="">Forum</a>
            <a class = "navbarA" href="">Leadership</a>
            <a class = "navbarA" href="">Database</a>
            <a class = "navbarA" href="">Review Emails</a>
        </div>
        <div style="width: 200px;"></div>
    </nav>

    <form id="form">
        <input class="login_feild" type="text" id="email" name="email" placeholder="Email" required> </input>
        <input class="login_feild" type="text" id="first" name="first" placeholder="First Name" required> </input>
        <input class="login_feild" type="text" id="last" name="last" placeholder="Last Name" required> </input>
        <input class="login_feild" type="text" id="phone" name="phone" placeholder="Phone Number" required> </input>
        <input class="login_feild" type="text" id="user" name="user" placeholder="Username" required> </input>
        <input class="login_feild" type="text" id="pass" name="pass" placeholder="Password" required> </input>
        <button class="login" type="submit" id="register" onclick="window.location.href = 'index.html';">Login</button>
        <a class="register" href="login.html">Already have an account? Click here.</a>
    </form>

    <script>
        const form = document.getElementById('form');
        const user = document.getElementById('user');
        const email = document.getElementById('email');
        const phone = document.getElementById('phone');
        

        form.addEventListener('submit', function(){
            const formData = FormData(event.target);

            localStorage.setItem('User',FormData.get('user').value);
            localStorage.setItem('Email',FormData.get('email').value);
            localStorage.setItem('Phone', FormData.get('phone').value);

            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
